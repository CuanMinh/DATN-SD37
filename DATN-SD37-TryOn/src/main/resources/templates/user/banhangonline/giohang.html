<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Bootstrap 5 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-dark text-white">
<div class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <a th:href="@{/home}" class="text-primary text-decoration-none">Trang chủ</a> >
        <span>Giỏ hàng</span>
    </nav>

    <!-- Tiêu đề -->
    <h2 class="mb-4">Giỏ hàng</h2>

    <div class="row">
        <!-- Danh sách sản phẩm -->
        <div class="col-lg-8">
            <th:block th:if="${not #lists.isEmpty(listGiohang.content)}">
                <th:block th:each="item : ${listGiohang}">
                    <div class="card mb-3 bg-secondary">
                        <div class="card-body d-flex align-items-center">
                            <!-- Nút Xóa -->
                            <form th:action="@{/customer/giohang/xoa}" method="post" class="me-3">
                                <input type="hidden" name="idGioHang" th:value="${item.id}"/>
                                <button type="submit" class="btn btn-link text-danger">
                                    <i class="fa fa-times"></i>
                                </button>
                            </form>
                            <!-- Hình ảnh sản phẩm -->
                            <img th:if="${hinhAnh[item.chiTietSanPham.id] != null}"
                                 th:src="@{'/getproduct/' + ${hinhAnh[item.chiTietSanPham.id].duongDan}}"
                                 alt="Hình ảnh sản phẩm" class="img-thumbnail rounded" width="80" height="80">
                            <div class="ms-3 flex-grow-1">
                                <!-- Tên sản phẩm -->
                                <h5 th:text="${item.chiTietSanPham.sanPham.ten}"></h5>
                                <!-- Thông tin chi tiết -->
                                <p class="mb-1 text-white-50">
                                    <span th:text="'Màu: ' + ${item.chiTietSanPham.mauSac.ten}"></span> |
                                    <span th:text="'Size: ' + ${item.chiTietSanPham.kichCo.ten}"></span>
                                </p>
                                <span class="fw-bold text-danger"
                                      th:text="${#numbers.formatDecimal(item.donGia, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>
                            <!-- Chỉnh số lượng -->
                            <div class="d-flex align-items-center">
                                <form th:action="@{/customer/giohang/giam}" method="post" class="me-2">
                                    <input type="hidden" name="idGioHang" th:value="${item.id}"/>
                                    <button type="submit" class="btn btn-sm btn-secondary">
                                        <i class="fa fa-minus"></i>
                                    </button>
                                </form>
                                <span class="mx-2" th:text="${item.soLuong}"></span>
                                <form th:action="@{/customer/giohang/tang}" method="post" class="ms-2">
                                    <input type="hidden" name="idGioHang" th:value="${item.id}"/>
                                    <button type="submit" class="btn btn-sm btn-secondary">
                                        <i class="fa fa-plus"></i>
                                    </button>
                                </form>
                                <form th:action="@{/customer/giohang/xemsanpham}" method="post" class="ms-2">
                                    <input type="hidden" name="idsanpham" th:value="${item.chiTietSanPham.sanPham.id}"/>
                                    <button type="submit" class="btn btn-sm btn-secondary">
                                        <i class="fas fa-eye"></i> <!-- Font Awesome Icon -->
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </th:block>
            </th:block>
            <!-- Thông báo giỏ hàng trống -->
            <th:block th:if="${#lists.isEmpty(listGiohang.content)}">
                <div class="alert alert-warning text-center">
                    <strong>Giỏ hàng của bạn đang trống!</strong> Hãy thêm sản phẩm vào giỏ hàng ngay.
                </div>
            </th:block>

            <!-- Phân trang -->
            <nav th:if="${listGiohang.totalPages >= 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${listGiohang.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/giohang(page=0)}">&laquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${listGiohang.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/giohang(page=${listGiohang.number - 1})}">&lsaquo;</a>
                    </li>
                    <!-- Nếu trang hiện tại > 1, hiển thị trang 1 và dấu "..." nếu cần -->
                    <th:block th:if="${listGiohang.number > 1}">
                        <li class="page-item">
                            <a class="page-link" th:href="@{/customer/giohang(page=0)}" th:text="1"></a>
                        </li>
                        <li class="page-item disabled" th:if="${listGiohang.number > 2}">
                            <span class="page-link">...</span>
                        </li>
                    </th:block>

                    <!-- Hiển thị các trang xung quanh trang hiện tại -->
                    <th:block th:each="i : ${#numbers.sequence(0, listGiohang.totalPages - 1)}">
                        <th:block th:if="${i >= listGiohang.number - 1 and i <= listGiohang.number + 1}">
                            <li class="page-item" th:classappend="${i == listGiohang.number} ? 'active'">
                                <a class="page-link" th:href="@{/customer/giohang(page=${i})}" th:text="${i + 1}"></a>
                            </li>
                        </th:block>
                    </th:block>

                    <!-- Nếu trang hiện tại < totalPages - 2, hiển thị dấu "..." và trang cuối -->
                    <th:block th:if="${listGiohang.number < listGiohang.totalPages - 2}">
                        <li class="page-item disabled">
                            <span class="page-link">...</span>
                        </li>
                        <li class="page-item">
                            <a class="page-link" th:href="@{/customer/giohang(page=${listGiohang.totalPages - 1})}"
                               th:text="${listGiohang.totalPages}"></a>
                        </li>
                    </th:block>
                    <li class="page-item" th:classappend="${listGiohang.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/giohang(page=${listGiohang.number + 1})}">&rsaquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${listGiohang.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/customer/giohang(page=${listGiohang.totalPages - 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="col-lg-4">
            <div class="card bg-secondary">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Tổng cộng</span>
                        <span class="fw-bold text-danger"
                              th:text="${#numbers.formatDecimal(tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Số lượng đơn hàng</span>
                        <span class="fw-bold" th:text="${soLuongDonHang} + ' đơn'"></span>
                    </div>
                    <form action="/customer/giohang/chuyentrangthanhtoan" method="post">
                        <button type="submit" class="btn btn-danger w-100">Thanh Toán</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Thông báo lỗi -->
<script th:if="${error}" th:inline="javascript">
    Swal.fire({
        icon: 'error',
        title: 'Lỗi',
        text: [[${error}]],
        confirmButtonText: 'OK'
    });
</script>
<!-- Thông báo thành công -->
<script th:if="${success}" th:inline="javascript">
    Swal.fire({
        icon: 'success',
        title: 'Thành công',
        text: [[${success}]],
        confirmButtonText: 'OK'
    });
</script>
</body>
</html>
