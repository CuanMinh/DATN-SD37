<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/index.html}">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Bootstrap 5 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
<div layout:fragment="content" class="col-lg-10 my-4"   style="min-height: 600px; border: 1px solid rgba(128, 128, 128, 0.212);">
<div class="col-md-9">
    <div class="product-grid" id="product-list">
        <div class="product-item" th:each="product : ${products}">
            <img th:if="${hinhAnh[product.id] != null}"
                 th:src="@{'/getproduct/' + ${hinhAnh[product.id].duongDan}}"
                 alt="Hình ảnh sản phẩm" class="img-thumbnail rounded" width="80" height="80">
            <p class="product-name" th:text="${product.ten}"></p>
            <p th:text="${#numbers.formatDecimal(gia, 0, 'COMMA', 0, 'POINT')} + ' VND'"></p>
            <a th:href="@{/chitietsanpham/xemchitietsanpham/{id}(id=${product.id})}" class="btn btn-primary">Xem chi tiết</a>

        </div>
    </div>
</div>
</div>
</body>
</html>
