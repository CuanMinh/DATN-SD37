<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Mã Giảm Giá</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content" class="col-lg-10 my-4">
    <h1>Thêm Mã Giảm Giá</h1>
    <form th:action="@{/admin/giamgia/luu}" method="post" th:object="${mgg}">

        <div class="form-group">
            <label for="code">Tên giảm giá</label>
            <input type="text" class="form-control" id="code" name="ten" th:field="*{ten}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('ten')}" th:errors="*{ten}"></small>
        </div>

        <div class="form-group">
            <label for="discountType">Loại giảm giá</label>
            <select id="discountType" name="loaiGiamGia" class="form-control" th:field="*{loaiGiamGia}">
                <option value="phan_tram">Phần trăm</option>
                <option value="tien_mat">Tiền mặt</option>
            </select>
        </div>

        <div class="form-group">
            <label for="discountValue">Giá trị giảm giá</label>
            <input type="number" class="form-control" id="discountValue" name="giaTriGiamGia" th:field="*{giaTriGiamGia}" required>
            <small id="discountMessage" class="text-danger"></small>
        </div>

        <div class="form-group">
            <label for="minOrderValue">Giá trị tối thiểu của hóa đơn</label>
            <input type="number" class="form-control" id="minOrderValue" name="giaTriGiamGiaToiDa" th:field="*{giaTriGiamGiaToiDa}" required>
            <small id="minOrderMessage" class="text-danger"></small>
        </div>

        <div class="form-group">
            <label for="startDate">Ngày bắt đầu</label>
            <input type="date" class="form-control" id="startDate" name="ngayBatDau" th:field="*{ngayBatDau}" required>
        </div>

        <div class="form-group">
            <label for="endDate">Ngày kết thúc</label>
            <input type="date" class="form-control" id="endDate" name="ngayKetThuc" th:field="*{ngayKetThuc}" required>
        </div>

        <div class="form-group">
            <label for="quantity">Số lượng</label>
            <input type="number" class="form-control" id="quantity" name="soLuong" th:field="*{soLuong}" required>
        </div>

        <div class="form-group">
            <label>Trạng thái</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="active" name="trangThai" value="1" th:checked="${mgg.trangThai == null or mgg.trangThai == 1}">
                <label class="form-check-label" for="active">Hoạt động</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="inactive" name="trangThai" value="0" th:checked="${mgg.trangThai == 0}">
                <label class="form-check-label" for="inactive">Không hoạt động</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/admin/giamgia" class="btn btn-secondary">Quay lại</a>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const discountType = document.getElementById("discountType");
        const discountValue = document.getElementById("discountValue");
        const minOrderValue = document.getElementById("minOrderValue");
        const discountMessage = document.getElementById("discountMessage");
        const minOrderMessage = document.getElementById("minOrderMessage");

        function validateDiscount() {
            let discount = parseFloat(discountValue.value);
            let minOrder = parseFloat(minOrderValue.value);
            if (discountType.value === "phan_tram") {
                if (discount < 0 || discount > 100) {
                    discountMessage.textContent = "Giá trị giảm giá theo phần trăm phải từ 0% đến 100%";
                    discountValue.value = "";
                } else {
                    discountMessage.textContent = "";
                }
            } else {
                if (discount < 0) {
                    discountMessage.textContent = "Giá trị giảm giá không thể nhỏ hơn 0";
                    discountValue.value = "";
                } else {
                    discountMessage.textContent = "";
                }
                if (discount > minOrder) {
                    minOrderMessage.textContent = "Giá trị tối thiểu của hóa đơn phải lớn hơn hoặc bằng số tiền giảm";
                    minOrderValue.value = "";
                } else {
                    minOrderMessage.textContent = "";
                }
            }
        }

        discountValue.addEventListener("input", validateDiscount);
        minOrderValue.addEventListener("input", validateDiscount);
    });
</script>

</body>
</html>
