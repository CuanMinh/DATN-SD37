<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 20px;
        }
        .filter-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-item {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .product-item img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Try On</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="text-center my-4">Danh sách sản phẩm</h1>
    <form method="get" th:action="@{/filter-products}">
        <div class="row">
            <div class="col-md-3 filter-section">
                <h5>Bộ lọc</h5>
                <label for="search">Tìm kiếm:</label>
                <input type="text" name="search" id="search" class="form-control"
                       placeholder="Nhập tên sản phẩm..." th:value="${selectedSearch}">

                <label for="brand" class="mt-2">Thương hiệu:</label>
                <select name="brand" id="brand" class="form-control">
                    <option value="">Tất cả</option>
                    <option th:each="thuongHieu : ${thuongHieu}"
                            th:value="${thuongHieu.id}"
                            th:text="${thuongHieu.ten}"
                            th:selected="${selectedBrand == thuongHieu.id}">
                    </option>
                </select>

                <label for="category" class="mt-2">Danh mục:</label>
                <select name="category" id="category" class="form-control">
                    <option value="">Tất cả</option>
                    <option th:each="danhMuc : ${danhMuc}"
                            th:value="${danhMuc.id}"
                            th:text="${danhMuc.ten}"
                            th:selected="${selectedCategory == danhMuc.id}">
                    </option>
                </select>

                <button type="submit" class="btn btn-primary mt-3">Lọc</button>
            </div>

            <div class="col-md-9">
                <div class="product-grid" id="product-list">
                    <div class="product-item" th:each="product : ${products}">
                        <img th:if="${hinhAnh[product.id] != null}"
                             th:src="@{'/getproduct/' + ${hinhAnh[product.id].duongDan}}"
                             alt="Hình ảnh sản phẩm" class="img-thumbnail rounded" width="80" height="80">
                        <p class="product-name" th:text="${product.ten}"></p>
                        <p th:text="${#numbers.formatDecimal(product.gia, 0, 'COMMA', 0, 'POINT')} + ' VND'"></p>
                        <a href="#" class="btn btn-primary">Xem chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
