<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Summer Men's Clothing Store" />
    <meta name="author" content="" />
    <title>Summer Men's Clothing</title>
    <link rel="icon" type="image/x-icon" th:href="@{/../assets/favicon.ico}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
</head>

<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Try On</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Owl Carousel Section -->
<div class="container my-4">
    <h2 class="text-center">Lựa chọn hàng đầu</h2>
    <div class="owl-carousel owl-theme">
        <div class="item"><img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/0e649bec-4698-4085-937e-2d2bf20b85da/AS+M+NSW+TEE+NK+EMBRD+SWSH+FS.png/500" alt="Slide 1"></div>
        <div class="item"><img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/0e649bec-4698-4085-937e-2d2bf20b85da/AS+M+NSW+TEE+NK+EMBRD+SWSH+FS.png/500" alt="Slide 2"></div>
        <div class="item"><img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/0e649bec-4698-4085-937e-2d2bf20b85da/AS+M+NSW+TEE+NK+EMBRD+SWSH+FS.png/500" alt="Slide 3"></div>
        <div class="item"><img src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/0e649bec-4698-4085-937e-2d2bf20b85da/AS+M+NSW+TEE+NK+EMBRD+SWSH+FS.png/500" alt="Slide 4"></div>
    </div>
</div>

<!-- Featured Products Section -->
<div class="container my-4">
    <h2 class="text-center">Sản phẩm nổi bật</h2>
    <div class="row">
        <div class="col-md-4" th:each="product : ${productss}">
            <div class="card">
                <img th:src="${product.url}" class="card-img-top" alt="Product Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.sanPham.ten}"></h5>
                    <p class="card-text" th:text="${#numbers.formatDecimal(product.gia, 0, 'COMMA', 0, 'POINT')} + ' VND'"></p>
                    <a href="#" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2024 Try On. All rights reserved.</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
<script>
    $(document).ready(function(){
        $(".owl-carousel").owlCarousel({
            loop: true,
            margin: 10,
            nav: true,
            autoplay: true,
            autoplayTimeout: 3000,
            responsive: {
                0: { items: 1 },
                600: { items: 2 },
                1000: { items: 3 }
            }
        });
    });
</script>
</body>
</html>
