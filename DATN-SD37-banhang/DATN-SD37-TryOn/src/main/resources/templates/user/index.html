<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>TryOn User</title>
    <!-- Favicon-->
<!--    <link rel="icon" type="image/x-icon" th:href="@{/../assets/favicon.ico}" />-->
    <!-- Core theme CSS (includes Bootstrap)-->
    <!-- CSS only -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
          integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
          crossorigin="anonymous">
    <!-- <link href="css/styles.css" rel="stylesheet" /> -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/../css/styles.css}">
    <script th:src="@{/../../js/app.js}"></script>
    <link rel="icon" type="image/x-icon" th:href="@{/../assets/favicon.ico}" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- Bootstrap Bundle (Gồm cả Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">


</head>

<body>
<!-- Navigation-->
<div th:replace="user/fragments/nav::nav"></div>

<!-- Page Content-->
<div class="container" style="margin-top: 3%;">
    <div class="row">
        <!-- Slide -->
        <div th:replace="user/fragments/slide::slide">
        </div>

        <!-- Menu -->
        <div th:replace="user/fragments/menu::menu">

        </div>

        <!-- Content -->
        <div layout:fragment="content"></div>

    </div>
</div>

<!-- Owl Carousel Section -->
<div class="container my-4">
    <h2 class="text-center">Lựa chọn hàng đầu</h2>
    <div class="owl-carousel owl-theme" id="productCarousel">
        <div class="item product-item" th:each="product : ${productss}" th:if="${product.trangThai == 1}">
            <img th:if="${hinhAnh[product.id] != null and not #strings.isEmpty(hinhAnh[product.id])}"
                 th:src="@{'/getproduct/' + ${hinhAnh[product.id].duongDan}}"
                 alt="Hình ảnh sản phẩm"
                 class="img-thumbnail rounded w-100"
                 th:attr="onclick='redirectToDetail(\'' + ${product.id} + '\')'"
                 style="cursor: pointer;">
        </div>
    </div>
</div>

<!-- Featured Products Section -->
<div class="container my-4">
    <h2 class="text-center">Sản phẩm nổi bật</h2>
    <div class="row">
        <div class="col-md-4" th:each="product : ${productss}" th:if="${product.trangThai == 1}">
            <div class="card">
                <img th:if="${hinhAnh[product.id] != null and not #strings.isEmpty(hinhAnh[product.id])}"
                     th:src="@{'/getproduct/' + ${hinhAnh[product.id].duongDan}}"
                     alt="Hình ảnh sản phẩm" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.ten}"></h5>
                    <p class="card-text" th:text="${#numbers.formatDecimal(gia, 0, 'POINT', 0, 'COMMA')} + ' VND'"></p>
                    <a href="#" class="btn btn-primary" th:href="@{/chitietsanpham/xemchitietsanpham/{id}(id=${product.id})}">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Footer-->
<div th:replace="user/fragments/footer::footer"></div>


<script>
    $(document).ready(function () {
        $("#productCarousel").owlCarousel({
            loop: true,
            margin: 10,
            nav: true,
            dots: true,
            autoplay: true,
            autoplayTimeout: 3000,
            autoplayHoverPause: true,
            responsive: {
                0: { items: 1 },
                600: { items: 2 },
                1000: { items: 3 }
            }
        });
    });

    function redirectToDetail(productId) {
        window.location.href = "/chitietsanpham/xemchitietsanpham/" + productId;
    }
</script>
</body>

</html>
