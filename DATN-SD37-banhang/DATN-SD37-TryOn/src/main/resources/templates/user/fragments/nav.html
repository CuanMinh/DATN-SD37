<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<style>
		body {
			font-family: Arial, sans-serif;
		}

		.navbar {
			background-color: deepskyblue !important;
			padding: 15px 30px;
		}

		.navbar-brand {
			font-size: 24px;
			font-weight: bold;
			letter-spacing: 2px;
		}

		.navbar-nav .nav-link {
			color: white !important;
			font-size: 18px;
			margin-left: 20px;
			transition: color 0.3s;
		}

		.navbar-nav .nav-link:hover {
			color: #ccc !important;
		}

		.navbar-toggler {
			border: none;
		}

		.navbar-toggler:focus,
		.navbar-toggler-icon:focus {
			outline: none;
			box-shadow: none;
		}

	</style>


</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
		styles="background-color: #2d4262 !important; margin-bottom: 30%;"
		th:fragment="nav">

		<div class="container-fluid">
			<a class="navbar-brand" href="#">Try On</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/customer/giohang/}">Cart</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Log out</a></li>
				</ul>
			</div>
		</div>
	</nav>
</body>

</html>
