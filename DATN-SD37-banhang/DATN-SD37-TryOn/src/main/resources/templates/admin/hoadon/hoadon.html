<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/index.html}">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Quản lý Hóa Đơn</title>
</head>
<body>
<div layout:fragment="content" class="col-lg-10 my-4"
     style="min-height: 600px; border: 1px solid rgba(128, 128, 128, 0.212);">
    <h1 class="text-center">Quản lý hóa đơn</h1>
    <br>
    <div class="container mb-3">
        <form th:action="@{/admin/hoadon}" method="get" class="row g-3">
            <div class="col-md-3">
                <label for="maHoaDon" class="form-label">Mã hóa đơn</label>
                <input type="text" class="form-control" id="maHoaDon" name="maHoaDon" th:value="${maHoaDon}">
            </div>
            <div class="col-md-3">
                <label for="startDate" class="form-label">Từ ngày</label>
                <input type="date" class="form-control" id="startDate" name="startDate"
                       th:value="${startDate != null ? #dates.format(startDate, 'yyyy-MM-dd') : ''}">
            </div>
            <div class="col-md-3">
                <label for="endDate" class="form-label">Đến ngày</label>
                <input type="date" class="form-control" id="endDate" name="endDate"
                       th:value="${endDate != null ? #dates.format(endDate, 'yyyy-MM-dd') : ''}">
            </div>
            <div class="col-md-2">
                <label for="trangThai" class="form-label">Trạng thái</label>
                <select class="form-select" id="trangThai" name="trangThai">
                    <option value="" th:selected="${trangThai == null}">Tất cả</option>
                    <option value="0" th:selected="${trangThai == 0}">Hủy đơn</option>
<!--                    <option value="1" th:selected="${trangThai == 1}">Hóa đơn chờ</option>-->
                    <option value="2" th:selected="${trangThai == 2}">Chờ xác nhận</option>
                    <option value="3" th:selected="${trangThai == 3}">Chờ lấy hàng</option>
                    <option value="4" th:selected="${trangThai == 4}">Đang giao hàng</option>
                    <option value="5" th:selected="${trangThai == 5}">Hoàn thành</option>
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Tìm</button>
            </div>
        </form>
    </div>

    <br>
    <a th:href="@{/admin/hoadon/view-create}" class="btn btn-success mb-3">
        <i class="bi bi-plus-lg"></i> Tạo hóa đơn mới
    </a>
    <div class="container">
        <div class="row">
            <!-- Bảng hóa đơn -->
            <div class="col-md-12"> <!-- Thay col-md-8 thành col-md-12 để bảng chiếm toàn bộ chiều rộng -->
                <h3>Danh sách hóa đơn</h3>
                <table class="table table-bordered table-hover table-rounded">
                    <thead class="text-center">
                    <tr>
                        <th>ID</th>
                        <th>Mã hóa đơn</th>
                        <th>Ngày tạo</th>
                        <th>Tổng tiền</th>
                        <th>TT Thanh toán</th>
                        <th>TT Đơn hàng</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hoaDon : ${hoaDons}">
                        <td th:text="${hoaDon.id}"></td>
                        <td th:text="${hoaDon.maHoaDon}"></td>
                        <td th:text="${#dates.format(hoaDon.ngayTaoHoaDon, 'dd/MM/yyyy HH:mm')}"></td>
                        <td style="font-weight: bold">
                            <span th:text="${#numbers.formatDecimal(hoaDon.tongTienCuoiCung, 0, 'COMMA', 0, 'POINT')}"></span>
                            VNĐ
                        </td>
                        <td>
                            <span th:class="${hoaDon.trangThaiThanhToan} == 0 ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${hoaDon.trangThaiThanhToan} == 0 ? 'Chưa thanh toán' : 'Đã thanh toán'"></span>
                        </td>
                        <td>
                            <span th:class="${hoaDon.trangThaiDonHang} == 0 ? 'badge bg-primary' : 'badge bg-secondary'"
                                  th:text="${hoaDon.trangThaiDonHang} == 0 ? 'Tại quầy' : 'Online'"></span>
                        </td>
                        <td>
                            <span th:switch="${hoaDon.trangThai}">
                                <span th:case="0" class="badge bg-secondary">Hủy đơn</span>
                                <span th:case="1" class="badge bg-primary">Hóa đơn chờ</span>
                                <span th:case="2" class="badge bg-warning text-dark">Chờ xác nhận</span>
                                <span th:case="3" class="badge bg-success">Chờ lấy hàng</span>
                                <span th:case="4" class="badge bg-success">Đang giao hàng</span>
                                <span th:case="5">Hoàn thành</span>
                            </span>
                        </td>
                        <td>
                            <!-- Chuyển hướng sang trang chi tiết hóa đơn -->
                            <a th:href="@{/admin/hoadon/detail/{id}(id=${hoaDon.id})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i> Xem
                            </a>
                            <form th:if="${hoaDon.trangThai != 0 and hoaDon.trangThai < 4}"
                                  th:action="@{/admin/hoadon/cancel/{id}(id=${hoaDon.id})}" method="post"
                                  class="d-inline">
                                <button class="btn btn-danger btn-sm" type="submit"
                                        onclick="return confirm('Bạn có chắc chắn muốn hủy hóa đơn này?')">
                                    <i class="bi bi-x-circle"></i> Hủy
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <nav style="text-align: center">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:if="${currentPage > 0}">
                            <a class="page-link" th:href="@{'/admin/hoadon?page=' + ${currentPage - 1} + '&size=5'}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{'/admin/hoadon?page=' + ${i} + '&size=5'}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:if="${currentPage < totalPages - 1}">
                            <a class="page-link" th:href="@{'/admin/hoadon?page=' + ${currentPage + 1} + '&size=5'}">Tiếp</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

</body>
</html>
