<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<!-- Thêm Bootstrap nếu chưa có -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
	<div class="container">
		<!-- Logo -->
		<a class="navbar-brand d-flex align-items-center" href="#">
			<img src="/../../assets/favicon.ico" width="40" height="40" class="me-2" alt="Logo">
			<strong>TryOn</strong>
		</a>

		<!-- Nút toggle trên mobile -->
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarResponsive" aria-controls="navbarResponsive"
				aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<!-- Nội dung navbar -->
		<div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
			<ul class="navbar-nav">
				<li class="nav-item dropdown">
					<a class="nav-link dropdown-toggle" href="#" id="dropdownMenuLink"
					   role="button" data-bs-toggle="dropdown" aria-expanded="false">
						Tài khoản
					</a>
					<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuLink">
						<li><a class="dropdown-item" href="#">Thông tin cá nhân</a></li>
						<li><a class="dropdown-item" th:href="@{/logout}">Đăng xuất</a></li>
					</ul>
				</li>
			</ul>
		</div>
	</div>
</nav>
</body>

</html>
