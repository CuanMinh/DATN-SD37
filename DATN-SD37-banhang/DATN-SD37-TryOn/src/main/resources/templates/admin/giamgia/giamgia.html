<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/index.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Mã Giảm Giá</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content" class="container my-4">
    <h1 class="mb-4">Quản lý Mã Giảm Giá</h1>

    <!-- Form tìm kiếm -->
    <form method="GET" action="/admin/giamgia" class="form-inline mb-3">
        <input type="text" name="keyword" class="form-control mr-2" placeholder="Tìm kiếm mã giảm giá..." th:value="${keyword}" required>
        <button type="submit" class="btn btn-primary">Tìm</button>
        <a href="/admin/giamgia" class="btn btn-secondary">Quay lại</a>
    </form>

    <a href="/admin/giamgia/them" class="btn btn-success mb-3">Thêm mã giảm giá</a>

    <!-- Bảng danh sách mã giảm giá -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Tên Giảm Giá</th>
                <th>Loại</th>
                <th>Giá Trị</th>
                <th>Giá Trị Tối Thiểu</th>
                <th>Số lượng</th>
                <th>Ngày bắt đầu</th>
                <th>Ngày kết thúc</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="mgg : ${mgglist}">
                <td th:text="${mgg.ten}"></td>
                <td th:text="${mgg.loaiGiamGia == 'Phần trăm' or mgg.loaiGiamGia == 'phan_tram' ? 'Phần trăm' : 'Tiền mặt'}"></td>
                <td>
                        <span th:if="${mgg.loaiGiamGia == 'Phần trăm' or mgg.loaiGiamGia == 'phan_tram'}"
                              th:text="${mgg.giaTriGiamGia} + '%'"></span>
                    <span th:if="${mgg.loaiGiamGia == 'Tiền mặt' or mgg.loaiGiamGia == 'tien_mat'}"
                          th:text="${#numbers.formatDecimal(mgg.giaTriGiamGia, 0, 2) + ' VNĐ'}"></span>
                </td>
                <td th:text="${#numbers.formatDecimal(mgg.giaTriGiamGiaToiDa, 0, 2) + ' VNĐ'}"></td>
                <td th:text="${mgg.soLuong}"></td>
                <td th:text="${#dates.format(mgg.ngayBatDau, 'dd/MM/yyyy')}"></td>
                <td th:text="${#dates.format(mgg.ngayKetThuc, 'dd/MM/yyyy')}"></td>
                <td th:text="${mgg.trangThai == 1 ? 'Hoạt động' : 'Không hoạt động'}"
                    th:classappend="${mgg.trangThai == 1 ? 'text-success' : 'text-danger'}"></td>
                <td>
                    <a class="btn btn-primary btn-sm" th:href="@{/admin/giamgia/sua/{id}(id=${mgg.id})}">Cập nhật</a>
                    <a class="btn btn-danger btn-sm" th:href="@{/admin/giamgia/ngung-hoat-dong/{id}(id=${mgg.id})}"
                       onclick="return confirm('Bạn có chắc chắn muốn ngừng hoạt động mã giảm giá này?');">
                        Ngừng hoạt động
                    </a>

                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
