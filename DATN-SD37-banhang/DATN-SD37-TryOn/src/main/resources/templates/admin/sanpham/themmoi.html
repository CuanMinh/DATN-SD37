<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/index.html}">
<head>
    <title></title>
    <style>
        .upload-container {
            width: 150px;
            height: 150px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-container img {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .edit-btn {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="container-fluid p-2 pt-3">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 24px; font-weight: 700;">Thêm mới sản phẩm</span>
        </div>

        <div class="mt-3">
            <form th:action="@{/admin/sanpham/them-moi}" th:object="${sanPham}" method="post" enctype="multipart/form-data" onsubmit="return beforeSubmit()">
                <div class="card">
                    <div class="card-header">
                        Thông tin sản phẩm
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="row">
                                    <div class="col-3">
                                        <div class="mb-3">
                                            <label for="ten" class="form-label">Tên</label>
                                            <input id="ten" th:field="*{ten}" required class="form-control" type="text" />
                                        </div>
                                    </div>
                                    <div class="col-3">
                                        <div class="mb-3">
                                            <label for="danhMuc" class="form-label">Danh mục</label>
                                            <select id="danhMuc" th:field="*{danhMucId}" class="form-control form-select">
                                                <option value="-1" disabled>Chọn danh mục</option>
                                                <option th:each="danhMuc : ${listDanhMuc}" th:value="${danhMuc.getId()}" th:text="${danhMuc.getTen()}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-3">
                                        <div class="mb-3">
                                            <label for="thuongHieu" class="form-label">Thương hiệu</label>
                                            <select id="thuongHieu" th:field="*{thuongHieuId}" class="form-control form-select">
                                                <option value="-1" disabled>Chọn thương hiệu</option>
                                                <option th:each="thuongHieu : ${listThuongHieu}" th:value="${thuongHieu.getId()}" th:text="${thuongHieu.getTen()}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-3">
                                        <div class="mb-3">
                                            <label for="chatLieu" class="form-label">Chất liệu</label>
                                            <select id="chatLieu" th:field="*{chatLieuId}" class="form-control form-select">
                                                <option value="-1" disabled>Chọn chất liệu</option>
                                                <option th:each="chatLieu : ${listChatLieu}" th:value="${chatLieu.id}" th:text="${chatLieu.ten}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <div class="mb-3">
                                        <label for="moTa" class="form-label">Mô tả</label>
                                        <textarea id="moTa" th:field="*{moTa}" class="form-control" rows="3"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="mb-3">
                                    <label class="form-label">Ảnh</label>

                                    <div class="d-flex justify-content-center">
                                        <div class="upload-container" onclick="document.getElementById('anhSanPham').click()">
                                            <img id="anhSanPhamXemTruoc" src="#" alt="Ảnh xem trước">
                                            <span id="iconUpload" class="fs-1 text-secondary">＋</span>
                                        </div>
                                        <input type="file" id="anhSanPham" th:field="*{anh}" accept="image/*" class="d-none" />
                                    </div>

                                    <script>
                                        document.getElementById("anhSanPham").addEventListener("change", function (event) {
                                            let input = event.target;
                                            let file = input.files[0];

                                            if (file) {
                                                let reader = new FileReader();

                                                reader.onload = function (e) {
                                                    let img = document.getElementById("anhSanPhamXemTruoc");
                                                    img.src = e.target.result;
                                                    img.style.display = "block";

                                                    document.getElementById("iconUpload").style.display = "none";
                                                    document.getElementById("btnSuaAnh").style.display = "block";
                                                };

                                                reader.readAsDataURL(file);
                                            }
                                        });

                                        document.getElementById("btnSuaAnh").addEventListener("click", function () {
                                            document.getElementById("anhSanPham").click();
                                        });
                                    </script>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        Loại sản phẩm
                    </div>
                    <div class="card-body">
                        <div>
                            <div id="loaiSanPhamContainer">
                            </div>
                            <div>
                                <button type="button" class="btn btn-primary btn-sm" onclick="themLoaiSanPham()">
                                    <i class="fa-solid fa-plus"></i> Thêm
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <script th:inline="javascript">
                    var listDanhMuc = /*[[${listDanhMuc}]]*/ [];
                    var listThuongHieu = /*[[${listThuongHieu}]]*/ [];
                    var listMauSac = /*[[${listMauSac}]]*/ [];
                    var listKichCo = /*[[${listKichCo}]]*/ [];
                    var listChatLieu = /*[[${listChatLieu}]]*/ [];
                </script>
                <script>
                    function themLoaiSanPham() {
                        let row = document.createElement("div");
                        row.classList.add("row", "mb-3");

                        let mauSacOptions = '<option value="-1" disabled selected>Chọn màu sắc</option>';
                        listMauSac.forEach(dm => {
                            mauSacOptions += `<option value="${dm.id}">${dm.ten}</option>`;
                        });

                        let kichCoOptions = '<option value="-1" disabled selected>Chọn kích cỡ</option>';
                        listKichCo.forEach(th => {
                            kichCoOptions += `<option value="${th.id}">${th.ten}</option>`;
                        });

                        let chatLieuOptions = '<option value="-1" disabled selected>Chọn chất liệu</option>';
                        listChatLieu.forEach(th => {
                            chatLieuOptions += `<option value="${th.id}">${th.ten}</option>`;
                        });

                        row.innerHTML = `
                            <div class="col-2">
                                <select class="form-control mau-sac">${mauSacOptions}</select>
                            </div>
                            <div class="col-2">
                                <select class="form-control kich-co">${kichCoOptions}</select>
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control trong-luong" placeholder="Trọng lượng">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control gia-goc" placeholder="Giá gốc">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control gia-giam" placeholder="Giá giảm">
                            </div>
                            <div class="col-2">
                                <input type="number" class="form-control so-luong" placeholder="Số lượng">
                            </div>
<!--                            <div class="col-2 d-flex align-items-center">-->
<!--                                <button type="button" class="btn btn-danger btn-sm" onclick="xoaLoaiSanPham(this)">Xóa</button>-->
<!--                            </div>-->
                        `;

                        document.getElementById("loaiSanPhamContainer").appendChild(row);
                    }

                    function beforeSubmit() {
                        let loaiSanPhamData = [];

                        document.querySelectorAll("#loaiSanPhamContainer .row").forEach(row => {
                            let mauSac = row.querySelector(".mau-sac").value;
                            let kichCo = row.querySelector(".kich-co").value;
                            let giaGoc = row.querySelector(".gia-goc").value;
                            let giaGiam = row.querySelector(".gia-giam").value;
                            let soLuong = row.querySelector(".so-luong").value;
                            let trongLuong = row.querySelector(".trong-luong").value;

                            if (mauSac !== "-1" && kichCo !== "-1" && giaGoc && soLuong) {
                                loaiSanPhamData.push({
                                    id: null,
                                    mauSacId: mauSac,
                                    kichCoId: kichCo,
                                    gia: parseFloat(giaGoc),
                                    giamGia: parseFloat(giaGiam),
                                    soLuong: parseInt(soLuong),
                                    trongLuong: trongLuong,
                                    sanPhamId: null,
                                    moTa: "",
                                });
                            }
                        });

                        if (loaiSanPhamData.length === 0) {
                            return false;
                        }

                        document.getElementById("loaiSanPhamData").value = JSON.stringify(loaiSanPhamData);
                        return true;
                    }
                </script>

                <input type="hidden" id="loaiSanPhamData" name="loaiSanPhamJson" th:field="*{listSanPham}" />
                <button type="submit" class="btn btn-primary mt-3">Thêm mới</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
